# Revue de presse : récupération toutes les heures (Vercel Hobby limite ses crons à un par jour).
# Secret requis dans le dépôt : CRON_SECRET (même valeur que sur Vercel).
name: Revue de presse

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Récupérer les articles
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "Secret CRON_SECRET absent" >&2; exit 1; fi
          curl -fsS --max-time 300 -H "authorization: Bearer $CRON_SECRET" https://signal-lycees.fr/api/cron/presse
